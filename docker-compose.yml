version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tự động chạy schema.sql khi khởi tạo database lần đầu
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: payment-app
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/payment_db
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      db:
        condition: service_healthy
    # Lệnh khởi chạy chính thức để đồng bộ mã nguồn
    command: npm start

volumes:
  pgdata:
