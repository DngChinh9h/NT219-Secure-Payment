services:
  db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  security-service:
    build:
      context: ./security-service
    container_name: payment-security-service
    expose:
      - "9443"
    environment:
      SECURITY_PORT: "9443"
      SECURITY_SERVER_CERT_PATH: /run/certs/security/security-server.crt
      SECURITY_SERVER_KEY_PATH: /run/certs/security/security-server.key
      SECURITY_CA_CERT_PATH: /run/certs/ca/internal-ca.crt
      JWT_PRIVATE_KEY_PATH: /run/keys/security/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/public/jwt-public.pem
      RECEIPT_PRIVATE_KEY_DIR: /run/keys/security/receipt-private
      RECEIPT_PUBLIC_KEY_DIR: /run/keys/security/receipt-public
    env_file:
      - path: ${SECURITY_SERVICE_ENV_FILE:-./local-secrets/security-service.env}
        required: false
    volumes:
      - ./local-secrets/security-dev/certs/ca:/run/certs/ca:ro
      - ./local-secrets/security-dev/certs/security:/run/certs/security:ro
      - ./local-secrets/security-dev/keys:/run/keys:rw

  backend:
    build: .
    container_name: payment-backend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/payment_db
      SECURITY_SERVICE_BASE_URL: https://security-service:9443
      SECURITY_CLIENT_CERT_PATH: /run/certs/backend/backend-client.crt
      SECURITY_CLIENT_KEY_PATH: /run/certs/backend/backend-client.key
      SECURITY_CA_CERT_PATH: /run/certs/ca/internal-ca.crt
      JWT_PUBLIC_KEY_PATH: /run/public/jwt-public.pem
    env_file:
      - path: ${BACKEND_ENV_FILE:-./local-secrets/backend.env}
        required: false
    volumes:
      - ./local-secrets/security-dev/certs/ca:/run/certs/ca:ro
      - ./local-secrets/security-dev/certs/backend:/run/certs/backend:ro
      - ./local-secrets/security-dev/keys/public:/run/public:ro
    depends_on:
      db:
        condition: service_healthy
      security-service:
        condition: service_started

volumes:
  pgdata:
